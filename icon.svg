<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1c1d2e"/>
      <stop offset="50%" stop-color="#0c0e17"/>
      <stop offset="100%" stop-color="#05060a"/>
    </radialGradient>
    
    <!-- Neon Halo Gradients -->
    <linearGradient id="ringCal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E3A"/>
      <stop offset="100%" stop-color="#FF2A6D"/>
    </linearGradient>
    <linearGradient id="ringProtein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
    <linearGradient id="ringCarbs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A"/>
      <stop offset="100%" stop-color="#FF9F0A"/>
    </linearGradient>
    <linearGradient id="ringFats" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF375F"/>
      <stop offset="100%" stop-color="#BF5AF2"/>
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.25)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Ambient Inner Orbs -->
  <circle cx="160" cy="160" r="120" fill="#5E5CE6" opacity="0.18" filter="url(#glow)"/>
  <circle cx="360" cy="220" r="100" fill="#FF5E3A" opacity="0.15" filter="url(#glow)"/>

  <!-- Apple Rings (Halo Concentric Gauges) -->
  <g transform="rotate(-90 256 256)">
    <!-- Calorie Ring (Outer) -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,94,58,0.15)" stroke-width="24"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringCal)" stroke-width="24" stroke-dasharray="1005" stroke-dashoffset="260" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Protein Ring -->
    <circle cx="256" cy="256" r="126" fill="none" stroke="rgba(10,132,255,0.15)" stroke-width="22"/>
    <circle cx="256" cy="256" r="126" fill="none" stroke="url(#ringProtein)" stroke-width="22" stroke-dasharray="791" stroke-dashoffset="190" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Carbs & Fats Ring (Inner) -->
    <circle cx="256" cy="256" r="92" fill="none" stroke="rgba(255,159,10,0.15)" stroke-width="20"/>
    <circle cx="256" cy="256" r="92" fill="none" stroke="url(#ringCarbs)" stroke-width="20" stroke-dasharray="578" stroke-dashoffset="150" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- Center Vision Glass Lens with Leaf / Scanner Glyph -->
  <circle cx="256" cy="256" r="64" fill="url(#glassSurface)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  
  <!-- Stylized Sparkling Crystal / Apple Health Spark -->
  <path d="M256 220 L264 248 L292 256 L264 264 L256 292 L248 264 L220 256 L248 248 Z" fill="#ffffff" filter="url(#glow)"/>
</svg>
